# -----------------------------------------------------------------------------
# JY's Log — a log about AI for drug design, antibodies and peptides
# -----------------------------------------------------------------------------

title: "JY's Log"
subtitle: "AI for Drug Design · Antibodies · Peptides"
name: "JY's Log"
description: >-
  A knowledge log on AI-driven drug design, computational antibody and peptide
  engineering, protein language models, and immune repertoire analysis.
url: "https://JY-Bioinfo.github.io"
baseurl: ""
repository: "JY-Bioinfo/JY-Bioinfo.github.io"
timezone: Asia/Shanghai

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title:output_ext

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  # standalone pages at the root
  - scope:
      path: "*.md"
      type: pages
    values:
      layout: page

# -----------------------------------------------------------------------------
# Build settings
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter_opts:
    block:
      line_numbers: false

# -----------------------------------------------------------------------------
# Navigation
# -----------------------------------------------------------------------------
nav:
  - label: "Posts"
    url: "/posts/"
  - label: "Projects"
    url: "/projects/"
  - label: "Categories"
    url: "/categories/"
  - label: "Tags"
    url: "/tags/"
  - label: "Search"
    url: "/search/"
