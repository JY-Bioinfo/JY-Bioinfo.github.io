# -----------------------------------------------------------------------------
# JY's Log — an index of knowledge projects on AI for drug design
# -----------------------------------------------------------------------------

title: "JY's Log"
subtitle: "AI for Drug Design · Antibodies · Peptides"
name: "JY's Log"
description: >-
  An index of knowledge projects on AI-driven drug design, computational
  antibody and peptide engineering, protein language models, and immune
  repertoire analysis.
url: "https://JY-Bioinfo.github.io"
baseurl: ""
repository: "JY-Bioinfo/JY-Bioinfo.github.io"
timezone: Asia/Shanghai

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# -----------------------------------------------------------------------------
# Build settings
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter_opts:
    block:
      line_numbers: false

# -----------------------------------------------------------------------------
# Navigation
# -----------------------------------------------------------------------------
nav:
  - label: "Projects"
    url: "/projects/"
